name: Build Android Preview

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/mobile/**"
      - "package-lock.json"
      - ".github/workflows/android-preview-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Validate mobile
        run: npm run typecheck --workspace=mobile

      - name: Validate Expo config
        working-directory: apps/mobile
        run: npx expo config --type public

      - name: Prepare Nethanel Elo native assets
        run: |
          python -m pip install --disable-pip-version-check pillow
          python apps/mobile/scripts/generate_elo_native_assets.py

      - name: Start Android preview build in EAS Cloud
        id: cloud_build
        continue-on-error: true
        working-directory: apps/mobile
        run: eas build --platform android --profile preview --non-interactive --no-wait

      - name: Build Android preview locally when EAS quota is unavailable
        if: steps.cloud_build.outcome == 'failure'
        working-directory: apps/mobile
        run: eas build --platform android --profile preview --local --non-interactive --output ./nethanel-elo-preview.apk

      - name: Upload local APK
        if: steps.cloud_build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: nethanel-elo-preview-apk
          path: apps/mobile/nethanel-elo-preview.apk
          if-no-files-found: error
          retention-days: 14
