name: Elo Factory - Validar credencial Firebase

on:
  pull_request:
    paths:
      - ".github/workflows/elo-firebase-credentials-check.yml"

permissions:
  contents: read

jobs:
  verify-firebase-access:
    # Segredos só podem ser usados nos PRs internos do proprio repositorio.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Instalar dependencia de autenticacao Google
        run: python -m pip install --disable-pip-version-check google-auth==2.39.0 requests==2.32.3

      - name: Confirmar chave, projeto e permissao de leitura
        env:
          ELO_FIREBASE_MANAGEMENT_SA_JSON: ${{ secrets.ELO_FIREBASE_MANAGEMENT_SA_JSON }}
        run: |
          python - <<'PY'
          import json, os, sys, urllib.error, urllib.request
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request

          raw = os.environ.get("ELO_FIREBASE_MANAGEMENT_SA_JSON", "").strip()
          if not raw:
              sys.exit("FALHA: GitHub Secret ELO_FIREBASE_MANAGEMENT_SA_JSON ausente.")
          try:
              account = json.loads(raw)
          except (json.JSONDecodeError, TypeError):
              sys.exit("FALHA: Secret não contém um JSON válido de conta de serviço.")
          if account.get("type") != "service_account":
              sys.exit("FALHA: JSON não representa uma conta de serviço.")
          if account.get("project_id") != "nethanel-elo":
              sys.exit("FALHA: conta aponta para projeto diferente de nethanel-elo.")
          email=account.get("client_email","")
          if not email.endswith("@nethanel-elo.iam.gserviceaccount.com"):
              sys.exit("FALHA: e-mail da conta de serviço não pertence ao projeto Elo.")

          print("OK: chave privada encontrada e associada ao projeto Firebase nethanel-elo.")
          try:
              credentials = service_account.Credentials.from_service_account_info(
                  account, scopes=["https://www.googleapis.com/auth/firebase"])
              credentials.refresh(Request())
          except Exception:
              sys.exit("FALHA: Google recusou a autenticação com a chave configurada.")

          url="https://firebase.googleapis.com/v1beta1/projects/nethanel-elo/androidApps?pageSize=100"
          req=urllib.request.Request(
              url, headers={
                  "Authorization": "Bearer " + credentials.token,
                  "Accept": "application/json",
              })
          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  data=json.load(response)
          except urllib.error.HTTPError as error:
              sys.exit(f"FALHA: Firebase Management API HTTP {error.code} ao consultar Android.")
          except Exception:
              sys.exit("FALHA: não foi possível consultar apps Android no Firebase.")

          apps=data.get("apps") or []
          target="br.com.nethanel.elo.cdfe3dfb737be4120a46a8f010beaabc3"
          if not any(a.get("packageName")==target for a in apps):
              sys.exit("FALHA: Adoradores Church não encontrada no projeto Firebase.")
          print(f"OK: permissões de leitura confirmadas ({len(apps)} aplicativos na primeira página).")
          print("OK: Android Adoradores Church encontrado.")
          print("Verificação apenas de leitura concluída. Nenhum aplicativo criado ou modificado.")
          PY
