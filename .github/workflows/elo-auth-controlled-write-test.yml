name: Elo Factory - teste controlado de gravacao OAuth

on:
  pull_request:
    paths:
      - ".github/workflows/elo-auth-controlled-write-test.yml"

permissions:
  contents: read

jobs:
  test-church-auth-write:
    if: github.event.pull_request.number == 43 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Validar URLs da igreja demo e gravar apenas se necessario
        env:
          ELO_SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.ELO_SUPABASE_MANAGEMENT_TOKEN }}
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import os
          import sys
          import elo_auth_redirects as auth

          # Registro real de APK Adoradores Church, ja validado no Supabase.
          # Nao cria solicitacao de build nem altera identificadores.
          record = {
              "id": "9b7fbc1e-2602-43b1-8edb-ce1a1d6d0183",
              "organization_id": "dfe3dfb7-37be-4120-a46a-8f010beaabc3",
              "android_package": "br.com.nethanel.elo.cdfe3dfb737be4120a46a8f010beaabc3",
              "app_scheme": "elodfe3dfb737be4120a46a",
          }
          if not os.environ.get("ELO_SUPABASE_MANAGEMENT_TOKEN","").strip():
              sys.exit("FALHA: credencial Management nao configurada.")
          initial = auth.management_request("GET")
          if not isinstance(initial, dict) or "uri_allow_list" not in initial:
              sys.exit("FALHA: Supabase Auth nao retornou redirect URLs.")
          original = auth.parse_urls(initial["uri_allow_list"])

          # Proteger todas as rotas existentes — inclusive a Elo Church Demo.
          required_prior = {
              "nethanelelo://**",
              "elo101212c56e814915ae9a://auth/callback",
          }
          if not required_prior.issubset(original):
              sys.exit("FALHA: nao foi possivel reconhecer URLs anteriores; cancelando antes de gravar.")

          confirmed = auth.verify_and_register([record])
          if confirmed != [record["id"]]:
              sys.exit("FALHA: callbacks da Adoradores nao foram confirmados.")

          final = auth.management_request("GET")
          after = auth.parse_urls(final.get("uri_allow_list"))
          if not set(original).issubset(after):
              sys.exit("FALHA: houve perda de alguma URL anterior.")
          if not set(auth.redirects_for(record)).issubset(after):
              sys.exit("FALHA: URLs da Adoradores nao foram gravadas.")

          print("OK: tres links OAuth da Adoradores Church configurados.")
          print(f"OK: {len(original)} URLs preexistentes mantidas, {len(after)} URLs agora autorizadas.")
          print("OK: nenhum APK gerado, nenhuma URL antiga removida, Site URL preservado.")
          PY
