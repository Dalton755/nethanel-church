name: Elo Factory - Verificar acesso seguro

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/elo-factory-verify-access.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validar conexao protegida com Supabase Elo
        env:
          ELO_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ELO_SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, urllib.request, urllib.error
          secret=os.environ.get("ELO_SUPABASE_SERVICE_ROLE_KEY","")
          if not secret:
              raise SystemExit("FALHA: falta secret ELO_SUPABASE_SERVICE_ROLE_KEY no repositorio.")
          url="https://esukjhuyooppxgfmltkb.supabase.co/rest/v1/church_apk_builds?select=id&limit=0"
          req=urllib.request.Request(url,headers={
              "apikey": secret, "Authorization": "Bearer "+secret,
              "Accept": "application/json"
          })
          try:
              with urllib.request.urlopen(req,timeout=20) as response:
                  if response.status != 200:
                      raise SystemExit("FALHA: conexao sem sucesso HTTP "+str(response.status))
              print("OK: segredo encontrado e acesso seguro ao Supabase Elo validado.")
              print("Nenhuma chave foi exibida nem alteracao realizada no banco.")
          except urllib.error.HTTPError as exc:
              raise SystemExit("FALHA: Supabase recusou acesso HTTP "+str(exc.code))
          PY
