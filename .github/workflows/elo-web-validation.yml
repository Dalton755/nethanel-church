name: Validar Elo Web (vinext)

on:
  pull_request:
    branches:
      - cloudflare-elo-vinext
    paths:
      - "apps/web/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/elo-web-validation.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Build Cloudflare
        run: npm run build:vinext --workspace web
