name: Elo App Factory - APK exclusivo da igreja

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/elo-app-factory.yml"
      # Uma atualização controlada em main pode solicitar novo processamento,
      # sem precisar editar este workflow em cada APK de teste.
      - "scripts/elo_factory_build_requests/*.txt"
  # A fila e verificada rapidamente; builds completos rodam apenas quando ha pedido.
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: elo-app-factory
  cancel-in-progress: false

jobs:
  check-pending:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      pending: ${{ steps.queue.outputs.pending }}
    steps:
      - name: Verificar fila de APKs sem iniciar compilacao
        id: queue
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ELO_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          key = os.environ.get("SUPABASE_SERVICE_ROLE_KEY", "").strip()
          if not key:
              raise SystemExit("Service role ausente; consulta a fila bloqueada.")
          url = ("https://esukjhuyooppxgfmltkb.supabase.co/rest/v1/"
                 "church_apk_builds?status=eq.queued&select=id&limit=1")
          req = urllib.request.Request(url, headers={
              "apikey": key,
              "Authorization": "Bearer " + key,
              "Accept": "application/json",
          })
          # Em falha da API, falhar em vez de retornar fila vazia.
          with urllib.request.urlopen(req, timeout=25) as response:
              rows = json.load(response)
          if not isinstance(rows, list):
              raise RuntimeError("Consulta da fila retornou formato invalido.")
          pending = bool(rows)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"pending={str(pending).lower()}\\n".replace("\\n", "\n"))
          print("Solicitacao pendente encontrada." if pending
                else "Fila vazia; nenhuma compilacao iniciada.")
          PY

  build-church-apk:
    needs: check-pending
    # Opt-out de emergencia: configurar ELO_FACTORY_PAUSED=true.
    if: needs.check-pending.outputs.pending == 'true' && vars.ELO_FACTORY_PAUSED != 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    steps:
      - name: Checkout de código revisado
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Registrar automaticamente o Android no Firebase
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ELO_SUPABASE_SERVICE_ROLE_KEY }}
          ELO_FIREBASE_MANAGEMENT_SA_JSON: ${{ secrets.ELO_FIREBASE_MANAGEMENT_SA_JSON }}
          ELO_FIREBASE_MANAGEMENT_SA_JSON_B64: ${{ secrets.ELO_FIREBASE_MANAGEMENT_SA_JSON_B64 }}
          ELO_FIREBASE_PROJECT_ID: nethanel-elo
        run: |
          python -m pip install --disable-pip-version-check google-auth==2.39.0 requests==2.32.3
          python scripts/elo_firebase_provision.py

      - name: Autorizar links exclusivos do Google no Supabase
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ELO_SUPABASE_SERVICE_ROLE_KEY }}
          ELO_SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.ELO_SUPABASE_MANAGEMENT_TOKEN }}
        run: python scripts/elo_auth_redirects.py

      - name: Associar e verificar FCM V1 no Expo por igreja
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ELO_SUPABASE_SERVICE_ROLE_KEY }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # Criacao/reutilizacao testada sem afetar apps reais (canary do Expo).
          # Somente pacotes derivados de uma igreja com APK solicitado chegam aqui.
          ELO_EXPO_ALLOW_CREATE_CREDENTIALS: "true"
        run: python scripts/elo_expo_fcm.py

      - name: Busca solicitação autorizada e inicia compilação
        id: claim
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ELO_SUPABASE_SERVICE_ROLE_KEY }}
          ELO_REQUIRE_OAUTH_URLS: "true"
          ELO_REQUIRE_EXPO_FCM: "true"
        run: |
          set -euo pipefail
          python scripts/elo_app_factory.py claim
          if test -f /tmp/elo-app-factory-claim.json; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "pending=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Java 17
        if: steps.claim.outputs.pending == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Node.js 24
        if: steps.claim.outputs.pending == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Expo e EAS
        if: steps.claim.outputs.pending == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Instalar dependências
        if: steps.claim.outputs.pending == 'true'
        run: |
          npm ci
          # A build local empacota uma cópia limpa e roda npm ci novamente.
          # As dependências nativas DEVEM constar do package.json e package-lock
          # gerados no runner (não apenas de node_modules).
          npm install --workspace=mobile expo@57.0.27 expo-constants@57.0.21 expo-linking@57.0.12 expo-notifications@57.0.22
          # Expo dynamic app.config.ts ja registra o plugin; npm grava a
          # dependencia e o lock para a reinstalacao interna do EAS.
          npm install --workspace=mobile expo-splash-screen

      - name: Validar configuração e Firebase da igreja
        if: steps.claim.outputs.pending == 'true'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ELO_SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/elo_app_factory.py prepare

      - name: Gerar arte nativa com ícone de push
        if: steps.claim.outputs.pending == 'true'
        run: |
          python -m pip install --disable-pip-version-check pillow
          python apps/mobile/scripts/prepare_white_label_assets.py \
            --icon-url "$ELO_ICON_URL" \
            --splash-url "$ELO_SPLASH_URL" \
            --background-color "$ELO_BACKGROUND_COLOR"

      - name: Validar código e identificação do app
        if: steps.claim.outputs.pending == 'true'
        run: |
          npm run typecheck --workspace=mobile
          cd apps/mobile
          npx expo config --type public --json > /tmp/elo-tenant-expo.json
          python - <<'PY'
          import json, os
          with open('/tmp/elo-tenant-expo.json',encoding='utf-8') as f: c=json.load(f)
          assert c['android']['package']==os.environ['ELO_ANDROID_PACKAGE']
          assert c['extra']['eloOrganizationId']==os.environ['ELO_ORGANIZATION_ID']
          assert c['name']==os.environ['ELO_APP_NAME']
          assert bool(c['extra']['eloBrandedPush'])==(os.environ['ELO_BRANDED_PUSH']=='true')
          print('Identidade de pacote, igreja e push validados.')
          PY

      - name: Compilar APK exclusivo
        if: steps.claim.outputs.pending == 'true'
        working-directory: apps/mobile
        run: eas build --platform android --profile preview --local --non-interactive --output ./elo-church-app.apk

      # Save the successfully compiled APK before any remote storage upload.
      # If Supabase rejects the size, the customer test APK still survives.
      - name: Disponibilizar APK de testes por 14 dias no GitHub
        if: success() && steps.claim.outputs.pending == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: elo-igreja-teste-${{ github.run_id }}
          path: apps/mobile/elo-church-app.apk
          retention-days: 14
          if-no-files-found: error
          compression-level: 0

      - name: Publicar APK em bucket privado da igreja
        if: success() && steps.claim.outputs.pending == 'true'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ELO_SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/elo_app_factory.py complete

      - name: Registrar falha (sem expor credenciais)
        if: failure() && steps.claim.outputs.pending == 'true'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ELO_SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/elo_app_factory.py fail
