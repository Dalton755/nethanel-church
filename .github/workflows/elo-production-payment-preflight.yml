name: Elo - Preparar Pix real + Webhook SEM ATIVAR

on:
  push:
    branches: [feature/elo-updates-foundation]
    paths:
      - "supabase/migrations/20261014114402_elo_production_pix_pilot_schema_inactive_v66.sql"
      - "supabase/functions/elo-developer-donations-production/**"
      - "supabase/functions/elo-asaas-production-webhook/**"
      - "scripts/elo_production_payment_preflight.py"
      - ".github/workflows/elo-production-payment-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: PostgreSQL parser e verificações de isolamento
        run: |
          python -m pip install --disable-pip-version-check pglast
          python scripts/elo_production_payment_preflight.py
          python scripts/elo_production_payments_lock_check.py
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validar backend Pix real (somente build)
        run: |
          deno check --config supabase/functions/elo-developer-donations-production/deno.json \
            supabase/functions/elo-developer-donations-production/index.ts \
            supabase/functions/elo-developer-donations-production/production-flow.ts \
            supabase/functions/elo-developer-donations-production/pix-provider.ts
      - name: Validar webhook real (somente build)
        run: |
          deno check --config supabase/functions/elo-asaas-production-webhook/deno.json \
            supabase/functions/elo-asaas-production-webhook/index.ts \
            supabase/functions/elo-asaas-production-webhook/webhook-flow.ts \
            supabase/functions/elo-asaas-production-webhook/verify-event.ts \
            supabase/functions/elo-asaas-production-webhook/reconcile-payments.ts
      - name: Testes de QR e evento simulados SEM REDE
        run: |
          deno test --no-check \
            supabase/functions/elo-developer-donations-production/pix-provider.test.ts \
            supabase/functions/elo-asaas-production-webhook/verify-event.test.ts \
            supabase/functions/elo-asaas-production-webhook/reconcile-payments.test.ts
