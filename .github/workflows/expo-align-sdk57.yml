name: Align Expo SDK 57 Dependencies

on:
  push:
    branches:
      - release/fix-expo-doctor
    paths:
      - ".github/workflows/expo-align-sdk57.yml"
      - "apps/mobile/package.json"
      - "apps/mobile/app.json"
      - "package-lock.json"

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: release/fix-expo-doctor

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Align Expo dependencies
        working-directory: apps/mobile
        run: npx expo install --fix

      - name: Validate Expo Doctor
        working-directory: apps/mobile
        run: npx expo-doctor

      - name: Commit aligned dependencies
        run: |
          if git diff --quiet -- apps/mobile/package.json package-lock.json; then
            echo "Dependencies already aligned."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/package.json package-lock.json
          git commit -m "fix: align Expo SDK 57 package versions"
          git push origin HEAD:release/fix-expo-doctor
