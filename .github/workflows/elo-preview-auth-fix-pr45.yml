name: Elo Studio - autorizar retorno OAuth de prévia #45

on:
  pull_request:
    paths:
      - ".github/workflows/elo-preview-auth-fix-pr45.yml"

permissions:
  contents: read

jobs:
  allowlist-preview-callback:
    # Privado: somente PR interna 45. NAO executar para forks.
    if: github.event.pull_request.number == 45 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Cadastrar retornos exatos da prévia e preservar URLs atuais
        env:
          ELO_SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.ELO_SUPABASE_MANAGEMENT_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, sys, urllib.request, urllib.error

          token=os.environ.get("ELO_SUPABASE_MANAGEMENT_TOKEN","").strip()
          if not token: sys.exit("FALHA: Secret da Management API ausente.")

          endpoint="https://api.supabase.com/v1/projects/esukjhuyooppxgfmltkb/config/auth"
          allowed=[
            "https://nethanel-church-9ssda372u-dalton-rocha-s-projects.vercel.app/painel",
            "https://nethanel-church-git-fix-elo-apk-f4981c-dalton-rocha-s-projects.vercel.app/painel"
          ]

          def api(method,body=None):
            request=urllib.request.Request(
              endpoint, method=method,
              data=None if body is None else json.dumps(body).encode(),
              headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
            try:
              with urllib.request.urlopen(request,timeout=30) as resp:
                return json.load(resp)
            except urllib.error.HTTPError as exc:
              sys.exit(f"FALHA: Supabase Management API HTTP {exc.code}.")
          def urls(value):
            if isinstance(value,str): return [u.strip() for u in value.split(",") if u.strip()]
            if isinstance(value,list) and all(isinstance(u,str) for u in value): return [u.strip() for u in value if u.strip()]
            sys.exit("FALHA: lista de Redirect URLs invalida.")

          before=api("GET")
          if not isinstance(before,dict) or "uri_allow_list" not in before:
            sys.exit("FALHA: campo uri_allow_list nao foi retornado.")
          previous=urls(before["uri_allow_list"])
          if "nethanelelo://**" not in previous:
            sys.exit("FALHA: allowlist principal ausente, nenhuma alteracao aplicada.")
          new=list(dict.fromkeys(previous+allowed))
          if len(new)>250:
            sys.exit("FALHA: limite de URLs excedido.")
          if new != previous:
            api("PATCH",{"uri_allow_list":",".join(new)})

          after=api("GET")
          if not isinstance(after,dict) or "uri_allow_list" not in after:
            sys.exit("FALHA: configuracao nao pode ser conferida.")
          current=urls(after["uri_allow_list"])
          if not set(previous).issubset(current) or not set(allowed).issubset(current):
            sys.exit("FALHA: URLs da prévia nao foram preservadas ou autorizadas.")
          print("OK: callback Google da prévia por URL do build e por alias fixo autorizado.")
          print("OK: URLs anteriores preservadas. Site URL e apps Android inalterados.")
          print(f"OK: {len(previous)} URLs antes, {len(current)} após; somente uri_allow_list.")
          PY
