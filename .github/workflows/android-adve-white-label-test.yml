name: Build ADVE White Label APK

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-adve-white-label-test.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  ELO_WHITE_LABEL: "true"
  ELO_APP_NAME: "ADVE"
  ELO_BACKGROUND_COLOR: "#F6F8FB"
  ELO_SCHEME: "adve"
  ADVE_ICON_URL: "https://esukjhuyooppxgfmltkb.supabase.co/storage/v1/object/public/church-branding/37ab597e-3771-4e71-8878-4ac42e770a5a/logo.jpg?v=1790473555753"
  ADVE_SPLASH_URL: "https://esukjhuyooppxgfmltkb.supabase.co/storage/v1/object/public/church-branding/37ab597e-3771-4e71-8878-4ac42e770a5a/logo.jpg?v=1790473555753"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Prepare ADVE native assets
        run: |
          python -m pip install --disable-pip-version-check pillow
          python apps/mobile/scripts/prepare_white_label_assets.py \
            --icon-url "$ADVE_ICON_URL" \
            --splash-url "$ADVE_SPLASH_URL" \
            --background-color "$ELO_BACKGROUND_COLOR"

      - name: Validate mobile
        run: npm run typecheck --workspace=mobile

      - name: Validate ADVE Expo config
        working-directory: apps/mobile
        run: npx expo config --type public

      - name: Build ADVE APK locally
        working-directory: apps/mobile
        run: eas build --platform android --profile preview --local --non-interactive --output ./adve-white-label.apk

      - name: Upload ADVE APK
        uses: actions/upload-artifact@v4
        with:
          name: adve-white-label-apk
          path: apps/mobile/adve-white-label.apk
          if-no-files-found: error
          retention-days: 14
