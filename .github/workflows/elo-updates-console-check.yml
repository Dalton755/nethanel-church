name: Elo - Validar Central de Atualizacoes (sem deploy)

on:
  push:
    branches: [feature/elo-updates-foundation]
    paths:
      - ".github/workflows/elo-updates-console-check.yml"
      - "apps/mobile/src/features/management/PlatformAppUpdatesScreen.tsx"
      - "apps/mobile/src/features/management/PlatformAppDistributionPlanner.tsx"
      - "apps/mobile/src/features/management/PlatformAdminScreen.tsx"
      - "apps/mobile/src/features/notifications/ChurchApkUpdatePrompt.tsx"
      - "apps/mobile/src/features/more/MoreScreen.tsx"
      - "apps/mobile/src/features/more/DeveloperOfferingScreen.tsx"
      - "apps/mobile/src/features/management/ChurchManagementScreen.tsx"
      - "apps/mobile/src/features/management/ChurchPersonalizationScreen.tsx"
      - "apps/mobile/src/features/management/PlatformAdminScreen.tsx"
      - "supabase/migrations/20261012190000_elo_free_for_all_draft.sql"
      - "supabase/migrations/20261012190100_elo_voluntary_developer_donations_draft.sql"
      - "supabase/migrations/20261012050442_elo_platform_updates_console_v58.sql"
      - "supabase/migrations/20261012165154_elo_platform_rollout_simulation_v59.sql"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependencias existentes
        run: npm ci
      - name: Validar TypeScript (sem gerar APK)
        run: npm run typecheck --workspace=mobile
      - name: Validar configuracao Expo
        working-directory: apps/mobile
        run: npx expo config --type public --json > /tmp/elo-console-expo-config.json
