name: Elo Demo - Testar atualizacao direto pelo app (v7)

# PREVIEW SEGREGADO: somente APK do Elo Church Demo e seu solicitante.
# Nao executa deploy Vercel, nao atualiza main, nao libera release em producao.
on:
  push:
    branches:
      - feature/elo-updates-foundation
    paths:
      - ".github/workflows/elo-update-demo-in-app-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: elo-demo-in-app-update-preview
  cancel-in-progress: false

jobs:
  in-app-update-demo:
    runs-on: ubuntu-22.04
    timeout-minutes: 110
    steps:
      - name: Checkout isolado da branch de preview
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Baixar APK v6 aprovado para comparar a assinatura
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/elo-demo-v6
          gh run download 38204228294 --repo "$GITHUB_REPOSITORY"             --name elo-church-demo-v6-in-app-preview             --dir /tmp/elo-demo-v6
          test -s /tmp/elo-demo-v6/elo-church-app.apk
          echo "APK v6 preservado para validar compatibilidade de instalacao."

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Expo EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Instalar dependencias nativas
        run: |
          npm ci
          npm install --workspace=mobile expo@57.0.27 expo-constants@57.0.21 expo-linking@57.0.12 expo-notifications@57.0.22 expo-splash-screen

      - name: Testes unitarios sem segredos
        run: |
          python -m py_compile scripts/elo_app_factory.py scripts/elo_verify_apk.py scripts/elo_update_canary.py
          PYTHONPATH=scripts python -m unittest -v test_elo_verify_apk

      - name: Validar APK anterior e preparar o Demo 1.0.7 (versionCode 7)
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ELO_SUPABASE_SERVICE_ROLE_KEY }}
          ELO_BASELINE_APK_PATH: /tmp/elo-demo-v6/elo-church-app.apk
        run: python scripts/elo_update_canary.py prepare

      - name: Fixar versionCode por igreja para este build
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('apps/mobile/eas.json')
          cfg=json.loads(path.read_text(encoding='utf-8'))
          cfg['cli']['appVersionSource']='local'
          cfg['build']['preview'].pop('autoIncrement',None)
          path.write_text(json.dumps(cfg,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Gerar marca nativa preservada do Elo Demo
        run: |
          python -m pip install --disable-pip-version-check pillow
          python apps/mobile/scripts/prepare_white_label_assets.py             --icon-url "$ELO_ICON_URL"             --splash-url "$ELO_SPLASH_URL"             --background-color "$ELO_BACKGROUND_COLOR"

      - name: Validar TypeScript e manifesto do novo APK
        run: |
          npm run typecheck --workspace=mobile
          cd apps/mobile
          npx expo config --type public --json > /tmp/elo-in-app-v3.json
          python - <<'PY'
          import json,os
          c=json.load(open('/tmp/elo-in-app-v3.json',encoding='utf-8'))
          assert c['extra']['eloOrganizationId']=='101212c5-6e81-4915-ae9a-fbde5b42bb04'
          assert c['android']['package']==os.environ['ELO_ANDROID_PACKAGE']
          assert c['android']['versionCode']==7
          assert c['version']=='1.0.7'
          print('VersionCode 7, package e tenant Elo Church Demo validados.')
          PY

      - name: Compilar APK Demo v7 sem deploy
        working-directory: apps/mobile
        run: eas build --platform android --profile preview --local --non-interactive --output ./elo-church-app.apk

      - name: Verificar certificado e publicar SOMENTE preview interno Demo
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ELO_SUPABASE_SERVICE_ROLE_KEY }}
          ELO_STAGE_DEMO_PREVIEW: "true"
        run: python scripts/elo_update_canary.py stage-preview

      - name: Backup de APK teste no GitHub por 7 dias
        uses: actions/upload-artifact@v4
        with:
          name: elo-church-demo-v7-in-app-preview
          path: apps/mobile/elo-church-app.apk
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
