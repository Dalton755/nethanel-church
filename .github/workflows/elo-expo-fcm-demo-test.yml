name: Elo Factory - associar FCM V1 na Elo Church Demo

on:
  pull_request:
    paths:
      - ".github/workflows/elo-expo-fcm-demo-test.yml"

permissions:
  contents: read

jobs:
  verify-link-fcm:
    if: github.event.pull_request.number == 44 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Associar FCM V1 salvo, sem acessar chave privada
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          PYTHONPATH=scripts python - <<'PY'
          from elo_expo_fcm import current_credentials, ensure_app_fcm

          demo = {
              "organization_id": "101212c5-6e81-4915-ae9a-fbde5b42bb04",
              "android_package": "br.com.nethanel.elo.c101212c56e814915ae9afbde5b42bb04",
          }
          adoradores_package = "br.com.nethanel.elo.cdfe3dfb737be4120a46a8f010beaabc3"
          before_key, before_apps = current_credentials()
          adoradores = next(
              (item for item in before_apps if item.get("applicationIdentifier") == adoradores_package),
              None
          )
          if not adoradores or (adoradores.get("googleServiceAccountKeyForFcmV1") or {}).get("id") != before_key:
              raise RuntimeError("Protecao: Adoradores Church deve continuar com FCM associado antes do teste.")
          status = ensure_app_fcm(demo, allow_create=False)
          after_key, after_apps = current_credentials()
          if after_key != before_key:
              raise RuntimeError("A chave FCM foi alterada durante o teste.")
          after_adoradores = next(
              (item for item in after_apps if item.get("applicationIdentifier") == adoradores_package),
              None
          )
          if not after_adoradores or (after_adoradores.get("googleServiceAccountKeyForFcmV1") or {}).get("id") != before_key:
              raise RuntimeError("A chave da Adoradores nao foi preservada.")
          print("OK: Expo FCM Elo Demo", status)
          print("OK: Adoradores preservada e sem nova chave criada.")
          print("OK: Nenhum APK recompilado.")
          PY
