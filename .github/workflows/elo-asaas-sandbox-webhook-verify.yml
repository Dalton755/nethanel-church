name: Elo - Validar receptor Asaas Sandbox (sem deploy)

on:
  push:
    branches: [feature/elo-updates-foundation]
    paths:
      - ".github/workflows/elo-asaas-sandbox-webhook-verify.yml"
      - "supabase/functions/elo-asaas-sandbox-webhook/**"
      - "supabase/migrations/20261013002628_elo_asaas_sandbox_webhook_receipts_v61.sql"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Analisar TypeScript e dependencias do receptor
        run: |
          deno check --config supabase/functions/elo-asaas-sandbox-webhook/deno.json \
            supabase/functions/elo-asaas-sandbox-webhook/index.ts
      - name: Testar dez casos de confirmação Pix simulada
        run: |
          deno test --no-check --config supabase/functions/elo-asaas-sandbox-webhook/deno.json \
            supabase/functions/elo-asaas-sandbox-webhook/parse-event.test.ts
      - name: Verificar que receptor publicado rejeita requisicoes nao autorizadas
        run: |
          set -eu
          URL="https://esukjhuyooppxgfmltkb.supabase.co/functions/v1/elo-asaas-sandbox-webhook"
          method_status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$URL")
          [ "$method_status" = "405" ] || { echo "GET esperado HTTP 405, recebido $method_status"; exit 1; }
          without_secret=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 \
            -X POST -H 'content-type: application/json' --data '{"event":"PAYMENT_RECEIVED"}' "$URL")
          # 401 comprova que o segredo foi carregado no Supabase.
          # 503 indicaria que a funcao continua sem o segredo configurado.
          [ "$without_secret" = "401" ] || {
            echo "ERRO: segredo nao confirmado. Esperado 401, recebido HTTP $without_secret";
            exit 1;
          }
          wrong_token=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 \
            -X POST -H 'content-type: application/json' \
            -H 'asaas-access-token: INVALID_SANDBOX_TOKEN_NEVER_MATCHES_00000000' \
            --data '{"event":"PAYMENT_RECEIVED"}' "$URL")
          [ "$wrong_token" = "401" ] || {
            echo "ERRO: token invalido nao foi bloqueado (HTTP $wrong_token)";
            exit 1;
          }
          echo "OK: token carregado, ausente e incorreto rejeitados (401). Nenhum pagamento simulado."
      - name: Verificar isolamento de dados financeiros de igrejas
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("supabase/functions/elo-asaas-sandbox-webhook/index.ts").read_text()
          assert 'ELO_ASAAS_SANDBOX_WEBHOOK_TOKEN' in p
          assert 'asaas-access-token' in p
          assert 'elo_asaas_sandbox_webhook_receipts' in p
          for x in ['organization_subscriptions','billing_invoices','billing_payment_attempts','platform_webhook_events','church_app_releases']:
            assert x not in p, x
          s=Path("supabase/migrations/20261013002628_elo_asaas_sandbox_webhook_receipts_v61.sql").read_text()
          assert "enable row level security" in s.lower()
          assert "from public, anon, authenticated" in s
          print("Somente eventos de teste; nenhuma escrita em tabelas financeiras das igrejas.")
          PY
