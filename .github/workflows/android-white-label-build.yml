name: Build Android White Label APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Nome que aparecerá no celular"
        required: true
        type: string
      android_package:
        description: "Package Android exclusivo, ex.: br.com.nethanel.minhaigreja"
        required: true
        type: string
      ios_bundle_id:
        description: "Bundle ID iOS (opcional; por padrão usa o package Android)"
        required: false
        type: string
      icon_url:
        description: "URL pública da logo/ícone da igreja"
        required: true
        type: string
      splash_url:
        description: "URL pública da imagem de abertura (opcional)"
        required: false
        type: string
      background_color:
        description: "Cor de fundo hexadecimal"
        required: true
        default: "#F6F8FB"
        type: string
      scheme:
        description: "Scheme exclusivo do app, ex.: minhaigreja"
        required: true
        type: string

permissions:
  contents: read

env:
  ELO_WHITE_LABEL: "true"
  ELO_APP_NAME: ${{ inputs.app_name }}
  ELO_ANDROID_PACKAGE: ${{ inputs.android_package }}
  ELO_IOS_BUNDLE_ID: ${{ inputs.ios_bundle_id || inputs.android_package }}
  ELO_BACKGROUND_COLOR: ${{ inputs.background_color }}
  ELO_SCHEME: ${{ inputs.scheme }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Install compatible splash package
        working-directory: apps/mobile
        run: npx expo install expo-splash-screen

      - name: Prepare white label auth callbacks
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          scheme = os.environ["ELO_SCHEME"].strip()
          if not scheme:
              raise SystemExit("ELO_SCHEME é obrigatório para evitar conflito entre aplicativos.")

          path = Path("apps/mobile/src/features/auth/AuthScreen.tsx")
          source = path.read_text(encoding="utf-8")
          source = source.replace(
              '"nethanelelo://auth/callback"',
              f'"{scheme}://auth/callback"',
          )
          source = source.replace(
              '"nethanelchurch://auth/confirm"',
              f'"{scheme}://auth/confirm"',
          )
          path.write_text(source, encoding="utf-8")
          print(f"Callbacks white label preparados para {scheme}://")
          PY

      - name: Prepare white label assets
        run: |
          python -m pip install --disable-pip-version-check pillow
          python apps/mobile/scripts/prepare_white_label_assets.py \
            --icon-url "${{ inputs.icon_url }}" \
            --splash-url "${{ inputs.splash_url }}" \
            --background-color "${{ inputs.background_color }}"

      - name: Validate mobile
        run: npm run typecheck --workspace=mobile

      - name: Validate resolved Expo config
        working-directory: apps/mobile
        run: |
          npx expo config --type public
          npx expo config --type public --json > /tmp/white-label-expo-config.json
          python - <<'PY'
          import json
          import os

          with open('/tmp/white-label-expo-config.json', encoding='utf-8') as handle:
              config = json.load(handle)

          assert config['name'] == os.environ['ELO_APP_NAME']
          assert config['scheme'] == os.environ['ELO_SCHEME']
          assert config['android']['package'] == os.environ['ELO_ANDROID_PACKAGE']
          print('Config white label validada: nome, scheme e package exclusivos.')
          PY

      - name: Build personalized APK
        working-directory: apps/mobile
        run: eas build --platform android --profile preview --local --non-interactive --output ./elo-white-label.apk

      - name: Upload personalized APK
        uses: actions/upload-artifact@v4
        with:
          name: elo-white-label-apk
          path: apps/mobile/elo-white-label.apk
          if-no-files-found: error
          retention-days: 14
